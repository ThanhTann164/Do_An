<!DOCTYPE html>
<html>
<head>
    <title>Quick Fix - Test APIs</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }
        button { margin: 5px; padding: 10px 15px; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Quick Fix - Test All APIs</h1>
    
    <div>
        <button onclick="testPing()">1️⃣ Test Ping</button>
        <button onclick="testNotificationUsers()">2️⃣ Test Notification Users</button>
        <button onclick="testAdminUsers()">3️⃣ Test Admin Users</button>
        <button onclick="fixDropdown()">🚀 Fix Dropdown</button>
    </div>
    
    <div id="results"></div>

    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = message;
            document.getElementById('results').appendChild(div);
        }
        
        async function testPing() {
            log('🏓 Testing ping...');
            try {
                const response = await fetch('http://localhost:3001/api/ping');
                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Ping successful: ${data.message}`, 'success');
                } else {
                    log(`❌ Ping failed: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ Ping error: ${error.message}`, 'error');
            }
        }
        
        async function testNotificationUsers() {
            log('👥 Testing notification users API...');
            
            const token = localStorage.getItem('token');
            if (!token) {
                log('❌ No token found. Setting new token...', 'error');
                localStorage.setItem('token', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjE4LCJyb2xlIjoiQWRtaW4iLCJlbWFpbCI6ImFkbWluQHNtYXJ0aG9tZS5jb20iLCJmdWxsTmFtZSI6IlN5c3RlbSBBZG1pbiIsInN0YXR1cyI6IkFjdGl2ZSIsImlhdCI6MTc2NDI1NDgxOCwiZXhwIjoxNzY0MzQxMjE4fQ.oTpm4SK8SIxBzD9YF6n_LB0bG2W5hFgA7ZGhEPLF4CQ');
                log('✅ Token set. Please try again.', 'success');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:3001/api/notifications/users', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    log(`✅ Notification Users API works! Found ${data.data.length} users`, 'success');
                    log(`<pre>${JSON.stringify(data.data.slice(0, 3), null, 2)}</pre>`, 'success');
                } else {
                    log(`❌ API failed: ${data.message || response.statusText}`, 'error');
                    log(`Status: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }
        
        async function testAdminUsers() {
            log('👤 Testing admin users API...');
            
            const token = localStorage.getItem('token');
            if (!token) {
                log('❌ No token found', 'error');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:3001/api/admin/users', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    log(`✅ Admin Users API works! Found ${data.data.length} users`, 'success');
                    log(`<pre>${JSON.stringify(data.data.slice(0, 3), null, 2)}</pre>`, 'success');
                } else {
                    log(`❌ API failed: ${data.message || response.statusText}`, 'error');
                }
            } catch (error) {
                log(`❌ Network error: ${error.message}`, 'error');
            }
        }
        
        async function fixDropdown() {
            log('🔧 Attempting to fix dropdown...');
            
            // Set token if not exists
            const token = localStorage.getItem('token');
            if (!token) {
                localStorage.setItem('token', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjE4LCJyb2xlIjoiQWRtaW4iLCJlbWFpbCI6ImFkbWluQHNtYXJ0aG9tZS5jb20iLCJmdWxsTmFtZSI6IlN5c3RlbSBBZG1pbiIsInN0YXR1cyI6IkFjdGl2ZSIsImlhdCI6MTc2NDI1NDgxOCwiZXhwIjoxNzY0MzQxMjE4fQ.oTpm4SK8SIxBzD9YF6n_LB0bG2W5hFgA7ZGhEPLF4CQ');
                log('✅ Token updated', 'success');
            }
            
            // Test notification API
            await testNotificationUsers();
            
            log('🔄 Now go to admin page and refresh!', 'success');
            log('<a href="http://localhost:3001/admin/notifications/send" target="_blank">Open Admin Page</a>', 'success');
        }
    </script>
</body>
</html>
