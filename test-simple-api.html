<!DOCTYPE html>
<html>
<head>
    <title>Test Package API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d1fae5; border: 1px solid #10b981; }
        .error { background: #fee2e2; border: 1px solid #ef4444; }
        button { padding: 10px 20px; margin: 5px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Package API</h1>
    
    <div>
        <h3>1. Login PRO User</h3>
        <button onclick="loginPro()">Login PRO User</button>
        <div id="login-result" class="result"></div>
    </div>

    <div>
        <h3>2. Get My Package</h3>
        <button onclick="getMyPackage()">Get My Package</button>
        <div id="package-result" class="result"></div>
    </div>

    <div>
        <h3>3. Test AI Feature</h3>
        <button onclick="testAI()">Test AI Title</button>
        <div id="ai-result" class="result"></div>
    </div>

    <script>
        let token = localStorage.getItem('token');

        async function loginPro() {
            try {
                const response = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'pro_test@example.com',
                        password: 'Test@1234'
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    document.getElementById('login-result').innerHTML = `
                        <div class="success">✅ Login thành công!<br>
                        Token: ${token.substring(0, 50)}...</div>
                    `;
                } else {
                    document.getElementById('login-result').innerHTML = `
                        <div class="error">❌ Login thất bại: ${data.message}</div>
                    `;
                }
            } catch (error) {
                document.getElementById('login-result').innerHTML = `
                    <div class="error">❌ Lỗi: ${error.message}</div>
                `;
            }
        }

        async function getMyPackage() {
            if (!token) {
                document.getElementById('package-result').innerHTML = `
                    <div class="error">❌ Chưa login! Hãy login trước.</div>
                `;
                return;
            }

            try {
                const response = await fetch('http://localhost:3001/api/packages/my-package', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                
                document.getElementById('package-result').innerHTML = `
                    <div class="${data.success ? 'success' : 'error'}">
                        <strong>Response:</strong><br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                document.getElementById('package-result').innerHTML = `
                    <div class="error">❌ Lỗi: ${error.message}</div>
                `;
            }
        }

        async function testAI() {
            if (!token) {
                document.getElementById('ai-result').innerHTML = `
                    <div class="error">❌ Chưa login! Hãy login trước.</div>
                `;
                return;
            }

            try {
                const response = await fetch('http://localhost:3001/api/ai/optimize-title', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: 'Nhà đẹp cần bán gấp'
                    })
                });

                const data = await response.json();
                
                document.getElementById('ai-result').innerHTML = `
                    <div class="${data.success ? 'success' : 'error'}">
                        <strong>AI Response:</strong><br>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            } catch (error) {
                document.getElementById('ai-result').innerHTML = `
                    <div class="error">❌ Lỗi: ${error.message}</div>
                `;
            }
        }

        // Auto-load token if exists
        if (token) {
            document.getElementById('login-result').innerHTML = `
                <div class="success">Token đã có: ${token.substring(0, 50)}...</div>
            `;
        }
    </script>
</body>
</html>
